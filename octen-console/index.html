  <script>
    (function() {
      try {
        var saved = localStorage.getItem('octen-theme') || 'system';
        var effective = saved;
        if (saved === 'system') {
          effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        if (effective === 'dark-trae') {
          document.documentElement.classList.add('dark', 'theme-trae');
          document.documentElement.setAttribute('data-theme', 'dark-trae');
        } else if (effective === 'dark' || effective === 'dark-cool') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('theme-trae');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark', 'theme-trae');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e){}
    })();
  </script>
</head>
