<!doctype html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Octen Sidebar Plans</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/sidebar.css"><style>*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#fff}.shell{padding:32px;min-height:100vh}.head{max-width:640px;margin:0 auto 24px}.head h1{margin:0;font-size:24px}.head p{color:#737373;font-size:14px}.tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid #dbdbdb;border-radius:10px;background:#fff}.tab{border:0;border-radius:7px;padding:8px 14px;background:none;color:#737373;cursor:pointer}.tab.active{background:#0a0a0a;color:#fff}.preview{display:block;flex:0 0 256px;width:256px;height:100vh;padding:0;border-radius:18px;overflow:hidden;background:#fff}.label{text-align:center;color:#737373;font-size:12px;margin:0 0 10px}.mount{width:256px;height:100%;min-height:0;margin:auto}@keyframes settingsIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}@keyframes settingsOut{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}.settings-enter{animation:settingsIn .22s cubic-bezier(.22,1,.36,1)}.settings-return{animation:settingsOut .22s cubic-bezier(.22,1,.36,1)}.settings-hidden{display:none!important}.settings-subnav{padding:0 12px!important;gap:0!important}.settings-back{height:56px;width:100%;border:0;background:transparent;display:flex;align-items:center;justify-content:flex-start;gap:70px;padding:0 12px;color:var(--sidebar-fg);font:inherit;cursor:pointer}.settings-back span{font-size:34px;font-weight:300;line-height:1}.settings-back strong{font-size:18px}.settings-items{display:flex;flex-direction:column;gap:2px}.settings-item{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:10px;background:transparent;text-align:left;padding:12px;color:var(--sidebar-fg);font:inherit;font-size:15px;cursor:pointer}.settings-item svg{width:20px;height:20px;flex-shrink:0}.settings-nav-arrow{margin-left:auto;width:18px!important;height:18px!important;color:#737373}.settings-item{transition:background-color .15s ease,color .15s ease}.settings-item:hover,.settings-item.active{background-color:transparent;background-image:linear-gradient(rgb(234,234,234),rgb(234,234,234))}.settings-item.active{color:var(--sidebar-primary);font-weight:500}.settings-item:hover svg,.settings-item.active svg{color:var(--sidebar-primary)}html.dark .settings-item:hover,html.dark .settings-item.active{background-color:#262626;background-image:none}.nav-section-label{display:flex;align-items:center;gap:6px}.search-label{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;line-height:20px;color:#717680;letter-spacing:0;text-transform:none}.search-divider{width:1px;height:12px;background:#d0d5dd;display:inline-block}.search-tier{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:14px;font-weight:700;font-style:italic;line-height:20px;letter-spacing:-.42px;text-transform:none}.search-tier.fast{color:#43bd2b}.search-tier.premier{color:#793fff}#sidebar-mount-a .nav-section-title{padding:14px 12px 8px;font-size:20px;font-weight:600;color:#717680;line-height:24px}#sidebar-mount-a .nav-section-title{padding:6px 12px 4px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.85;line-height:20px}#sidebar-mount-a .search-card{border:1px solid #d9d9d9;border-radius:12px;padding:6px;gap:2px;margin-bottom:8px!important;border-bottom:1px solid #d9d9d9!important}#sidebar-mount-a .search-card .nav-section-label{padding:6px 12px 4px;font-size:12px;text-transform:uppercase;opacity:.8}#sidebar-mount-a .search-card .nav-item{padding:8px 12px}#sidebar-mount-a .search-card .nav-item span{font-size:14px}#sidebar-mount-a .sidebar-nav{gap:0}#sidebar-mount-a .nav-group:not(:last-child){border-bottom:1px solid #e7e7e7;padding-bottom:12px;margin-bottom:6px}#sidebar-mount-a .nav-group:not(:first-child){padding-top:6px}#sidebar-mount-b .sidebar-nav{gap:0}#sidebar-mount-b .nav-group:not(:last-child){border-bottom:1px solid #e7e7e7;padding-bottom:12px;margin-bottom:6px}#sidebar-mount-b .nav-group:not(:first-child){padding-top:6px}html.dark body{background:#fff;color:#0a0a0a}html.dark .preview{background:#1a1a1a}html.dark .tab.active{background:#60ff70;color:#141414}</style></head><body><main class="shell"><section style="display:flex;justify-content:center;align-items:flex-start;gap:32px;flex-wrap:wrap"><div class="preview" data-preview="a"><div id="sidebar-mount-a" class="mount"></div></div><div class="preview" data-preview="b"><div id="sidebar-mount-b" class="mount"></div></div></section></main><script>(function(){var s=localStorage.getItem('octen-theme')||'system',d=s==='dark'||(s==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d)})();</script><script src="js/sidebar-config.js"></script><script src="js/theme.js"></script><script src="js/sidebar-component.js"></script><script src="js/app.js"></script></body></html>
