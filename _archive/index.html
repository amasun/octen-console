<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Octen Console — Org Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="src/css/app.css">
<style>
  #app-loader {
    position: fixed;
    inset: 0;
    background: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.3s ease;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #e2e8f0;
    border-top-color: #039855;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body class="flex h-screen overflow-hidden bg-slate-50">

<div id="app-loader">
  <div class="spinner"></div>
</div>

<main class="flex-1 overflow-y-auto">
  <!-- Pages will be loaded here dynamically -->
</main>

<script>
(async function() {
  if (window.location.protocol === 'file:') {
    document.body.innerHTML = `
      <div class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 p-8 shadow-xl">
          <div class="w-12 h-12 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-center text-emerald-600 mb-6">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <h2 class="text-xl font-semibold text-slate-900 mb-3">Local File Access Blocked (CORS)</h2>
          <p class="text-sm text-slate-600 leading-relaxed mb-6">
            Modern browsers block loading local HTML templates and components directly from the file system due to security restrictions. To run this console, you need to use a local development server.
          </p>
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100 mb-6">
            <h3 class="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">How to Run</h3>
            <ol class="list-decimal list-inside text-xs text-slate-600 space-y-2">
              <li>Open your terminal in this project directory.</li>
              <li>Run <code class="bg-slate-200 px-1 py-0.5 rounded text-emerald-700 font-mono font-medium">npm run dev</code> to start the server.</li>
              <li>Open <a href="http://localhost:3000" class="text-emerald-600 font-medium hover:underline">http://localhost:3000</a> in your browser.</li>
            </ol>
          </div>
          <div class="text-xs text-slate-400 text-center">
            Octen Console Prototype &middot; Developer Environment
          </div>
        </div>
      </div>
    `;
    return;
  }

  const pages = [
    'overview', 'web-search', 'broad-search-api', 'web-flow',
    'web-chat', 'broad-search', 'api-keys', 'usage', 'billing',
    'extract', 'collect', 'settings', 'model', 'image-search',
    'video-search', 'multimodal-search', 'deep-research'
  ];

  const scripts = [
    'src/js/main.js',
    'src/js/modules/search-playground.js',
    'src/js/modules/model-playground.js',
    'src/js/modules/deep-research-data.js',
    'src/js/modules/deep-research.js',
    'src/js/modules/answer.js',
    'src/js/modules/extract.js',
    'src/js/modules/web-search-app.js',
    'src/js/modules/broad-search-api.js'
  ];

  async function loadHtml(selector, filePath, position = 'beforeend') {
    try {
      const res = await fetch(filePath);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const html = await res.text();
      document.querySelector(selector).insertAdjacentHTML(position, html);
    } catch (e) {
      console.error(`Failed to load HTML fragment: ${filePath}`, e);
    }
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = (e) => {
        console.error(`Failed to load script: ${src}`, e);
        reject(e);
      };
      document.body.appendChild(script);
    });
  }

  try {
    // 1. Load layout components
    await loadHtml('body', 'src/layout/sidebar.html', 'afterbegin');
    
    // 2. Load pages into main
    for (const page of pages) {
      await loadHtml('main', `src/pages/${page}.html`, 'beforeend');
    }
    
    // 3. Load modals
    await loadHtml('body', 'src/modals/modals.html', 'beforeend');
    
    // 4. Load scripts in sequence
    for (const src of scripts) {
      await loadScript(src);
    }
  } catch (err) {
    console.error('Bootstrap failed:', err);
  } finally {
    // 5. Hide loader
    const loader = document.getElementById('app-loader');
    if (loader) {
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 300);
    }
  }
})();
</script>
</body>
</html>
