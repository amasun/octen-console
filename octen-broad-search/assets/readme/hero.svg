<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="600" fill="#f8fafc"/>
  
  <style>
    .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 56px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-size: 24px; font-weight: 400; fill: #64748b; line-height: 1.5; }
    .category { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; fill: #039855; letter-spacing: 0.1em; text-transform: uppercase; }
    .code { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #64748b; }
    .code-hl { fill: #0f172a; font-weight: 600; }
    .code-string { fill: #039855; }
    .card-title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; fill: #0f172a; }
  </style>

  <!-- Left Side: Content -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" class="category">octen-broad-search</text>
    
    <text x="0" y="60" class="title">Broad Search</text>
    <text x="0" y="120" class="title">Console &amp; API</text>
    
    <text x="0" y="180" class="subtitle">A management console and interactive</text>
    <text x="0" y="215" class="subtitle">playground for configuring, testing,</text>
    <text x="0" y="250" class="subtitle">and managing Octen's multimodal search APIs.</text>

    <!-- Logo / small detail -->
    <g transform="translate(0, 320) scale(1.5)">
      <path d="M34.5889 19.4629C35.2825 19.4629 35.8456 20.0437 35.8457 20.7588V22.8359C35.8457 23.5511 35.2826 24.1318 34.5889 24.1318H32.9482C32.6138 24.1319 32.2948 24.2683 32.0596 24.5107L31.6846 24.8975C31.4494 25.1417 31.3175 25.4705 31.3174 25.8135V27.5049C31.3174 28.22 30.7542 28.8007 30.0605 28.8008H28.0449C27.3514 28.8005 26.7891 28.2199 26.7891 27.5049V25.4277C26.7891 24.7127 27.3514 24.1321 28.0449 24.1318H30.0605C30.3951 24.1318 30.714 23.9954 30.9492 23.7529C31.1845 23.5085 31.3174 23.1792 31.3174 22.8359V20.7588C31.3175 20.0437 31.8805 19.4629 32.5742 19.4629H34.5889ZM3.26953 19.4619C3.96314 19.4619 4.52616 20.0418 4.52637 20.7568V22.7373H4.53027C4.53027 23.0805 4.66313 23.4099 4.89844 23.6543C5.19296 23.9595 5.5936 24.1299 6.01172 24.1299H7.70801C8.40164 24.13 8.96484 24.7107 8.96484 25.4258V27.5029C8.96484 28.218 8.40164 28.7987 7.70801 28.7988H5.69238C4.99884 28.7986 4.43652 28.218 4.43652 27.5029V25.7549C4.43652 25.3237 4.27076 24.9119 3.97461 24.6064C3.68003 24.301 3.27868 24.1299 2.86035 24.1299H1.25684C0.56324 24.1299 0.000225421 23.55 0 22.835V20.7568C0.000207591 20.0418 0.563229 19.4637 1.25684 19.4619H3.26953ZM15.1572 24.1299C15.8512 24.1299 16.414 24.7103 16.4141 25.4258V27.502C16.4138 28.2173 15.8512 28.7969 15.1572 28.7969H13.1445C12.4506 28.7969 11.8879 28.2173 11.8877 27.502V25.4258C11.8878 24.7103 12.4505 24.1299 13.1445 24.1299H15.1572ZM22.6084 24.1299C23.3022 24.1301 23.8642 24.7105 23.8643 25.4258V27.502C23.864 28.2171 23.3021 28.7966 22.6084 28.7969H20.5947C19.9008 28.7969 19.3381 28.2173 19.3379 27.502V25.4258C19.338 24.7103 19.9007 24.1299 20.5947 24.1299H22.6084ZM23.8916 0C24.5853 0 25.1484 0.580774 25.1484 1.2959V2.92969C25.1485 3.32316 25.3 3.70085 25.5684 3.97754L25.7588 4.17285C26.0272 4.44959 26.3935 4.60645 26.7734 4.60645H28.3086C29.0022 4.60645 29.5653 5.18632 29.5654 5.90137V18.6621L29.5693 18.666C29.5691 19.3809 29.006 19.9608 28.3125 19.9609H10.3154C9.62183 19.9609 9.05882 19.381 9.05859 18.666V16.8867C9.05859 16.5417 8.92574 16.2123 8.69043 15.9697L8.68555 15.9648C8.35437 15.6234 7.90463 15.4307 7.4375 15.4307H5.91797C5.22434 15.4307 4.6613 14.8508 4.66113 14.1357V1.2959C4.66121 0.580774 5.22428 0 5.91797 0H23.8916ZM10.3486 4.56836C9.6549 4.56836 9.0918 5.14906 9.0918 5.86426V13.7256C9.0918 14.209 9.27624 14.6713 9.60742 15.0127C9.84436 15.2551 10.1634 15.3915 10.4961 15.3916H23.8799C24.5735 15.3915 25.1367 14.8108 25.1367 14.0957V6.04883C25.1367 5.65537 24.9852 5.27766 24.7168 5.00098H24.7178C24.4477 4.72454 24.0819 4.56843 23.7021 4.56836H10.3486ZM14.5508 7.97949C15.2447 7.97949 15.8074 8.55902 15.8076 9.27441V11.0898C15.8075 11.8053 15.2448 12.3857 14.5508 12.3857H12.791C12.097 12.3857 11.5343 11.8053 11.5342 11.0898V9.27441C11.5344 8.55902 12.097 7.97949 12.791 7.97949H14.5508ZM21.3574 7.97949C22.0514 7.97949 22.6141 8.55902 22.6143 9.27441V11.0898C22.6142 11.8053 22.0515 12.3857 21.3574 12.3857H19.5967C18.9028 12.3855 18.3409 11.8052 18.3408 11.0898V9.27441C18.341 8.55918 18.9029 7.97974 19.5967 7.97949H21.3574Z" fill="#039855"/>
    </g>
  </g>

  <!-- Right Side: Diagram / Mockup -->
  <g transform="translate(640, 80)">
    <!-- Main Window Frame -->
    <rect x="0" y="0" width="480" height="440" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Editor Header -->
    <rect x="0" y="0" width="480" height="56" rx="16" fill="#f8fafc"/>
    <!-- Overlap block to make bottom sharp, top rounded -->
    <rect x="0" y="28" width="480" height="28" fill="#f8fafc"/>
    <rect x="0" y="56" width="480" height="2" fill="#e2e8f0"/>
    
    <text x="32" y="34" class="card-title">Configuration</text>
    
    <!-- Python toggle -->
    <rect x="360" y="14" width="88" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- dot -->
    <circle cx="376" cy="29" r="3" fill="#039855"/>
    <text x="388" y="33" class="code" style="font-size: 13px">Python</text>
    
    <!-- Editor Content -->
    <g transform="translate(32, 84)">
      <!-- Code Block -->
      <rect x="0" y="0" width="416" height="130" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <text x="24" y="32" class="code"><tspan class="code-hl">import</tspan> requests</text>
      <text x="24" y="56" class="code">url = <tspan class="code-string">"https://api.octen.ai/v1/search"</tspan></text>
      <text x="24" y="80" class="code">headers = {</text>
      <text x="48" y="104" class="code"><tspan class="code-string">"Authorization"</tspan>: <tspan class="code-string">"Bearer $OCTEN_KEY"</tspan></text>
      <text x="24" y="128" class="code">}</text>
    </g>
    
    <!-- Response Section -->
    <g transform="translate(32, 230)">
      <!-- Label -->
      <text x="0" y="0" class="card-title" style="font-size: 14px; fill: #64748b">JSON Response</text>
      
      <!-- Terminal Block -->
      <rect x="0" y="14" width="416" height="150" rx="8" fill="#0f172a"/>
      
      <text x="24" y="44" class="code" fill="#ffffff" style="font-family:'JetBrains Mono'; font-size:13px; fill:#e2e8f0;">{</text>
      <text x="40" y="68" class="code" fill="#ffffff" style="font-family:'JetBrains Mono'; font-size:13px; fill:#10b981;">"status"</text>
      <text x="108" y="68" class="code" fill="#ffffff" style="font-family:'JetBrains Mono'; font-size:13px; fill:#e2e8f0;">: 200,</text>
      <text x="40" y="92" class="code" fill="#ffffff" style="font-family:'JetBrains Mono'; font-size:13px; fill:#10b981;">"data"</text>
      <text x="94" y="92" class="code" fill="#ffffff" style="font-family:'JetBrains Mono'; font-size:13px; fill:#e2e8f0;">: [</text>
      <text x="56" y="116" class="code" fill="#ffffff" style="font-family:'JetBrains Mono'; font-size:13px; fill:#e2e8f0;">{ ... results ... }</text>
      <text x="40" y="140" class="code" fill="#ffffff" style="font-family:'JetBrains Mono'; font-size:13px; fill:#e2e8f0;">]</text>
      <text x="24" y="164" class="code" fill="#ffffff" style="font-family:'JetBrains Mono'; font-size:13px; fill:#e2e8f0;">}</text>
    </g>
  </g>
</svg>
